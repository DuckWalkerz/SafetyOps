name: SafetyOps
options:
  bundleIdPrefix: com.safetyops
  deploymentTarget:
    iOS: "16.0"
targets:
  SafetyOps:
    type: application
    platform: iOS
    sources: [SafetyOps]
    info:
      path: SafetyOps/Info.plist
      properties:
        CFBundleDisplayName: Mobile Escort
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Location required for contact compliance."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Continuous background location required for contact compliance."
        NSCameraUsageDescription: "Camera feed required for contact compliance."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: [location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safetyops.field
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
